[package]
name = "oorv-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "oorv_core"

[dependencies]
pest = "2.5"
pest_derive = "2.5"
serde = { version = "1.0.130", features = ["derive"] }
unicode-normalization = "0.1.24"
lazy_static = "1.3.0" # lazy_static! macro
num = "0.3.1" # infinite precision rationals
num-rational = { version = "0.3.2", features = ["serde"] }
itertools = "0.13.0"
rust_decimal = { version = "1.36.0", features = ["maths"] }
petgraph = "0.5"
rusttyc = "0.5.0"
codespan-reporting = {version = "0.11.1", features=["serialization"]} # Error Reporting
uom = { version = "0.31.1", default-features = false, features = [
    "autoconvert",
    "rational64",
    "si",
    "std",
    "use_serde",
] }
sha2 = "0.10"
dot = "0.1.4"
serde_json = "1.0.86"
ordered-float = "3.2.0"
num-traits = "0.2.16"
byteorder = "1.3.2"
bit-set = "0.5.1"
bimap = "0.6.3"
dyn-clone = "1.0.12"
crossbeam-channel = { version = "0.5.6", optional = true }
regex = "1.2.1"
humantime = "2.0"
hex = "0.4.3"
either = "1.5.3"
string_template = "0.2.1"
priority-queue = "1.1.0"
chrono = { version = "0.4", features = ["alloc"] }

[features]
queued-api = ["dep:crossbeam-channel"]
serde = ["ordered-float/serde"]
default = ["queued-api"]
